# Tuned config for the over-RAM (memory-constrained) Linux runbook target.
# Mirrors bench/vector/pg/tuned.conf's intent (throwaway, bulk-load-optimized) but
# sized DOWN so the working set (index + hot rows) deliberately exceeds
# container memory -- the whole point of this config is to force disk-bound
# graph/list traversal and measure the latency cliff, not to make it fast.
#
# Scale shared_buffers/work_mem/maintenance_work_mem to ~15-20% of the
# container's --memory limit; leave the rest for the OS page cache, which is
# what actually gets starved once the dataset exceeds --memory.

listen_addresses = '*'  # container port mapping only reaches non-loopback binds
shared_buffers = 128MB
effective_cache_size = 256MB
maintenance_work_mem = 256MB
work_mem = 16MB
max_parallel_maintenance_workers = 2
max_worker_processes = 4
max_parallel_workers = 4

fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0

random_page_cost = 1.1
effective_io_concurrency = 200   # real Linux/SSD target: posix_fadvise is available here

logging_collector = off
log_min_messages = warning
