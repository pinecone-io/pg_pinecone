# LABELED FOLLOW-UP, corpus 2 half of followup_c1_wikidpr.yaml -- see that
# file's header for the probe-coverage hypothesis and the skip_unfiltered
# rationale (doubly required here: corpus 2 is IVF-easy unfiltered and its
# record run was ABORTED by exactly this hardness gate). One system, recall-
# first (the record run's corpus-2 C1 plateau was 0.716 at the 0.126 default
# fraction, anchored below).
name: followup_c1_mid
seed: 42
k: 10
warmup_queries: 20
hardness_recall_threshold: 0.97
min_throughput_seconds: 5.0

postgres:
  maintenance_work_mem: 8GB
  min_wal_size: 1GB
  max_wal_size: 4GB

dataset:
  kind: synthetic
  n: 1000000
  dim: 768
  n_centers: 8000
  cluster_sigma: 0.35
  cluster_scale_mix: [0.8, 1.0, 1.25]
  background_frac: 0.02
  n_queries: 500

metric: l2

filters:
  selectivities: [0.01]
  modes: [correlated]
  run:
    - {selectivity: 0.01, mode: correlated}

systems:
  - name: pnat_f1_rm12
    type: pg_pinecone_native
    skip_unfiltered: true
    build_params: {seed: 42, k_bits: 1024, rescore_multiplier: 12,
                   mode_l_threshold: 0.005, filter_column: filt_correlated_0010_eq}
    sweep_param: scan_fraction
    sweep_values: [0.126, 0.25, 0.5, 1.0]

concurrency: [1, 8]

churn:
  enabled: false

sift1m:
  enabled: false
