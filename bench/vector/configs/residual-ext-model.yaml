# The pn_model_k1 system of residual-ext.yaml alone: what the shipping mode_l_threshold (0.03) does for the 1% key (exact mode L over the key rows).
# Re-run of the third system on 2026-10-14 after its plan gate failed on the mixed-case name pn_modeL_k1 (Postgres folds items_<name>_idx).
# Cell: C1 (1% key + 0.3% residual, 33 rows), 1 and 8 clients, same harness and dataset as residual-ext.yaml.
name: residual_ext_model
seed: 42
k: 10
warmup_queries: 20
hardness_recall_threshold: 0.97
min_throughput_seconds: 5.0

postgres:
  maintenance_work_mem: 8GB
  min_wal_size: 1GB
  max_wal_size: 4GB

dataset:
  kind: real
  artifact: wikidpr_768d_1m.npz
  n: 1000000
  dim: 768
  n_centers: 1000
  kmeans_sample: 100000
  kmeans_iters: 15
  n_queries: 500

metric: l2

filters:
  query_modes: [out_region]
  run:
    - {selectivity: 0.01, mode: correlated, residual: {selectivity: 0.003, mode: uncorrelated}}

systems:
  - name: pn_model_k1
    type: pg_pinecone_native
    skip_unfiltered: true
    record_scan_stats: true
    explain_probe: true
    build_params: {seed: 42, filter_column: filt_correlated_0010_eq}
    sweep_param: mode_l_threshold
    sweep_values: [0.03]
    iterative_scan_values: ["off"]

concurrency: [1, 8]

churn:
  enabled: false

sift1m:
  enabled: false
