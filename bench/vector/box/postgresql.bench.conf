# Box defaults (r6id.4xlarge, 128 GB), installed by user-data.sh under /opt/pg_pinecone-bench; the harness's own clusters use pg/tuned.linux-aws.conf
listen_addresses = '127.0.0.1'
shared_buffers = 32GB
effective_cache_size = 96GB
work_mem = 64MB
maintenance_work_mem = 8GB
max_wal_size = 64GB
checkpoint_timeout = 30min
jit = off
random_page_cost = 1.1
track_io_timing = on
max_connections = 200
default_text_search_config = 'pg_catalog.english'
log_min_messages = warning
log_line_prefix = '%m [%p] %q%a '
# an error must not log its statement: the API key goes through set_api_key
log_min_error_statement = panic
shared_preload_libraries = 'pg_pinecone'
pinecone.databases = 'bench'
pinecone.worker_naptime_ms = 2000
