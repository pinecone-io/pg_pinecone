# Tuned config for a GCP box (c4-standard-16: 16 vCPU,
# 58GB RAM, hyperdisk, Ubuntu 24.04) -- the Linux sibling of pg/tuned.conf
# (which is pinned to the original Mac). Selected via BENCH_TUNED_CONF env
# var (see harness/pgctl.py). Same philosophy: throwaway single-workload
# instance, durability traded for speed, deterministic plans, autovacuum off.
#
# NOT for the over-RAM cells: those cap the whole server under a cgroup
# (systemd-run -p MemoryMax=8G); shared_buffers here would exceed the cap.
# The over-RAM runs use their own conf.

shared_buffers = 14GB
effective_cache_size = 40GB
maintenance_work_mem = 2GB
work_mem = 256MB
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_maintenance_workers = 8

fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
wal_buffers = 64MB
min_wal_size = 4GB
max_wal_size = 16GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

max_connections = 64

random_page_cost = 1.1
# Linux has posix_fadvise; SSD-backed hyperdisk (tuned.conf's own comment
# says to set this on the Linux target).
effective_io_concurrency = 200

logging_collector = off
log_min_messages = warning

autovacuum = off
