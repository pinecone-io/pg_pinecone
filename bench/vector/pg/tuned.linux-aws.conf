# Tuned config for the AWS r6id.4xlarge box (16 vCPU, 128 GB, NVMe instance store, Ubuntu 24.04, PGDG Postgres 17):
# the Linux sibling of pg/tuned.conf, selected with BENCH_TUNED_CONF. Memory, planner and jit settings follow
# box/postgresql.bench.conf (the same box recipe); the rest keeps this harness's throwaway-instance
# choices (durability traded for speed, autovacuum off, deterministic plans).
# Several clusters can run at once (a remote config's `postgres:` block lowers shared_buffers).

shared_buffers = 32GB
effective_cache_size = 96GB
maintenance_work_mem = 8GB
work_mem = 256MB
max_worker_processes = 24
max_parallel_workers = 16
max_parallel_maintenance_workers = 8

fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
wal_buffers = 64MB
min_wal_size = 4GB
max_wal_size = 64GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

max_connections = 200

random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
track_io_timing = on

logging_collector = off
log_min_messages = warning
log_line_prefix = '%m [%p] %q%a '

autovacuum = off
