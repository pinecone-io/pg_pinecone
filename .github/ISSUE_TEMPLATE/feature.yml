name: Feature request
description: Request a new capability or a change. Open this before a pull request.
body:
  - type: markdown
    attributes:
      value: |
        Pinecone maintains the extension and its roadmap. A maintainer replies here, and you
        agree on the approach, before anyone opens a pull request.

        Questions and feedback belong in the [Pinecone Discord](https://discord.gg/tJ8V62S3sH).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What would you like to change?
    validations:
      required: true
