name: Docker backfill 0.11.0

# One-off: v0.11.0 predates the Dockerfile, so publish its images from main
# (the extension crate is unchanged since that tag). Dispatch on this branch,
# then delete the branch.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: pineconeteam/pg_pinecone
  VERSION: 0.11.0

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-pg${{ matrix.pg }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push manifest tags
        working-directory: /tmp/digests
        run: |
          tags=(-t "${IMAGE}:${VERSION}-pg${{ matrix.pg }}" -t "${IMAGE}:pg${{ matrix.pg }}")
          [ "${{ matrix.pg }}" = 18 ] && tags+=(-t "${IMAGE}:latest")
          docker buildx imagetools create "${tags[@]}" \
            $(for d in *; do echo "${IMAGE}@sha256:$d"; done)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}-pg${{ matrix.pg }}"
